name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python ${{ matrix.python-version }}
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: ccpy-ci

      - name: Install fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran g++ meson libopenblas-dev

      - name: Install libint2
        run: |
          conda install --yes --override-channels -c conda-forge libint eigen boost-cpp

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install ccpy
        run: |
          python -m pip install --verbose --no-build-isolation --editable . -Csetup-args="-Dlibint2_prefix=$CONDA_PREFIX" -Ccompile-args="-j2"

      - name: Short test
        run: |
          pytest tests -v -m short
        if: github.event_name == 'pull_request'

      - name: Full test
        run: |
          pytest tests -v
        if: github.event_name != 'pull_request'
